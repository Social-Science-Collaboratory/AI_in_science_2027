      affiliations:
        - name: "Department of Marketing"
    - name: "Nabiha Iqbal"
      affiliations:
        - name: "Department of Psychology"
    - name: "Minyi Jiang"
      affiliations:
        - name: "Department of Psychology"
    - name: "Rui Jin"
      affiliations:
        - name: "Department of Psychology"
    - name: "Zhongchi Li"
      affiliations:
        - name: "Department of Psychology"
    - name: "Sooyeon Park"
      affiliations:
        - name: "Department of Psychology"
    - name: "Mariana G. Rebello"
      affiliations:
        - name: "School of Special Education, School Psychology, and Early Childhood Studies"
    - name: "Jihyun Soh"
      affiliations:
        - name: "Department of Marketing"
    - name: "Paola J. Sullivan"
      affiliations:
        - name: "Department of Family, Youth and Community Sciences"
    - name: "Lyra G. Toohey"
      affiliations:
        - name: "Department of Psychology"
    - name: "Sofia C. Villanueva"
      affiliations:
        - name: "Department of Psychology"
  date: today
  repo-url: https://github.com/Social-Science-Collaboratory/AI_in_science_2027
  repo-branch: main
  repo-actions: [edit, source, issue]
  downloads: [pdf]
  sharing: [twitter, linkedin, facebook]
  sidebar:
    collapse-level: 1
  # weeks/NN- is syllabus week NN; week 1 is covered by the preface.
  chapters:
    # index.qmd has no title of its own, so label its sidebar entry here.
    - href: index.qmd
      text: "Preface"
    - part: "Ideation and Project Management"
      chapters:
        - weeks/02-project-management-using.qmd
        - weeks/03-project-management-critiquing.qmd
    - part: "Literature Review and Synthesis"
      chapters:
        - weeks/04-literature-review-using.qmd
        - weeks/05-literature-review-critiquing.qmd
    - part: "Data Collection and Generation"
      chapters:
        - weeks/06-data-collection-using.qmd
        - weeks/07-data-collection-critiquing.qmd
    - weeks/08-analysis.qmd
    - weeks/09-ethics-who-does-science.qmd
    - weeks/10-writing.qmd
    - weeks/11-outreach.qmd
    - weeks/12-ethics-what-should-count.qmd
    - weeks/13-epilogue.qmd
    - weeks/14-ai-philosophies.qmd
    - references.qmd

number-sections: false

crossref:
  chapters: false

bibliography: references.bib
csl: nature.csl

format:
  html:
    theme:
      - flatly
      - brand
      - theme/custom.scss
    include-after-body:
      - theme/sidebar-autohide.html
      - theme/share-x.html
    template-partials:
      - theme/title-metadata.html
    fig-dpi: 300
    toc: false
  pdf:
    documentclass: scrreprt
    fig-format: pdf



