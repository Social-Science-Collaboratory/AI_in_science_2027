project:
  type: book
  # scale-ladder/ and week-summary/ are figure packages, not chapters: their R,
  # data and standalone drafts are sourced by the chapters, never rendered as
  # pages of the book.
  render:
    - index.qmd
    - weeks/*.qmd
    - references.qmd
  # Chunks run from the project root, not from the chapter's own folder, so a
  # chapter in weeks/ can source("week-summary/R/week-summary.R") by the same
  # root-relative path index.qmd uses.
  execute-dir: project

book:
  title: "2027 Guide to AI in Science"
  author:
    - name: "Nicholas A. Coles"
      email: "ncoles@ufl.edu"
      affiliations:
        - name: "Bureau of Economic and Business Research"
    - name: "Alaukik, Abhay"
      affiliations:
        - name: "Department of Psychology"
  date: "8/22/2026"
  repo-url: https://github.com/Social-Science-Collaboratory/AI_in_science_2027
  repo-branch: main
  repo-actions: [edit, source, issue]
  downloads: [pdf]
  sharing: [twitter, linkedin, facebook]
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "Project Management"
      chapters:
        - weeks/01-project-management-using.qmd
        - weeks/02-project-management-critiquing.qmd
    - part: "Literature Review"
      chapters:
        - weeks/03-literature-review-using.qmd
        - weeks/04-literature-review-critiquing.qmd
    - part: "Idea Development"
      chapters:
        - weeks/05-idea-development-using.qmd
        - weeks/06-idea-development-critiquing.qmd
    - part: "Data Collection"
      chapters:
        - weeks/07-data-collection-using.qmd
        - weeks/08-data-collection-critiquing.qmd
    - part: "Analysis"
      chapters:
        - weeks/09-analysis-using.qmd
        - weeks/10-analysis-critiquing.qmd
    - part: "Writing"
      chapters:
        - weeks/11-writing-using.qmd
        - weeks/12-writing-critiquing.qmd
    - part: "Dissemination"
      chapters:
        - weeks/13-dissemination-using.qmd
        - weeks/14-dissemination-critiquing.qmd
    - weeks/15-personal-ai-philosophy.qmd
    - references.qmd

number-sections: false

bibliography: references.bib
csl: nature.csl

format:
  html:
    theme:
      - flatly
      - brand
      - custom.scss
    include-after-body:
      - sidebar-autohide.html
      - share-x.html
    fig-dpi: 300
  pdf:
    documentclass: scrreprt
    fig-format: pdf



