project:
  type: book
  # Only chapters render; figure-packages/ and theme/ are sourced, not pages.
  render:
    - index.qmd
    - weeks/*.qmd
    - references.qmd
  # Chunks run from the project root, so figure-package paths are root-relative.
  execute-dir: project
  # Media served from the site itself (podcast audio, review PDF).
  resources:
    - media/**

book:
  title: "2027 UF Guide to AI in Science"
  author:
    - name: "Nicholas A. Coles"
      email: "ncoles@ufl.edu"
      affiliations:
        - name: "Department of Psychology"
        - name: "Bureau of Economic and Business Research"
    - name: "Abhay Alaukik"
      affiliations:
        - name: "Department of Psychology"
    - name: "Majed A. Arishi"
      affiliations:
        - name: "Department of Civil and Coastal Engineering"
